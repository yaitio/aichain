# qwen — provider settings + its models (data tier)

[provider]
key      = "qwen"
client   = "qwen"
env_key  = "DASHSCOPE_API_KEY"
label    = "Qwen (DashScope)"
keys_url = "https://dashscope.aliyuncs.com"
auth     = "bearer"
max_tokens_field = "max_completion_tokens"
models_path      = "/compatible-mode/v1/models"

chat_path        = "/compatible-mode/v1/chat/completions"
images_path      = "/compatible-mode/v1/images/generations"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# Reasoning is declared because the provider maps it, though the chat models here ignore it.
# Pixel size only, written with '*' instead of 'x'; an aspect ratio has no
# field and is converted to a size at a 1024 short edge. No seed: the same
# value twice gave two different pictures, measured 2026-09-09.
format_accepts = ["size", "aspect_ratio"]
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 0.7
max_tokens  = 8192
top_p = 0.8


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · DashScope's default for chat models"
top_p       = "vendor · DashScope's default"
max_tokens  = "ours · qwen-max's own ceiling. It was 2048 until 2026-09-09 — a quarter of what the model takes and the smallest in the table, so a long answer was cut off by us rather than by the provider"
[provider.reasoning_map]
low = true
medium = true
high = true

# Prices: Alibaba Cloud Model Studio, international (Singapore), read
# 2026-10-10. USD per 1M tokens at the lowest input tier; image models per
# picture. qwen-vl-max, qwen-vl-plus and the qwen-image-edit and wan2.2
# models answer "does not exist" to this project's key — they are on the
# international list, so it is the account's workspace, not the catalogue;
# they are kept. qwen3-max, qwen3-235b-a22b, qwen3-72b, qwen3-32b and QwQ-32B
# were removed 2026-10-16: still not found, and newer models replace them.
[models."qwen3.8-max"]
caps  = ["text-to-text"]
price = { input = 2.0, output = 6.0 }

[models."qwen3.7-max"]
caps  = ["text-to-text"]
price = { input = 2.5, output = 7.5 }

[models."qwen3.7-plus"]
caps  = ["text-to-text"]
price = { input = 0.4, output = 1.6 }

[models."qwen3.6-plus"]
caps  = ["text-to-text"]
price = { input = 0.5, output = 3.0 }
json_schema = false   # DashScope makes a schema json_object and wants "json" in the messages: HTTP 400, 2026-10-16

[models."qwen3.5-plus"]
caps  = ["text-to-text"]
price = { input = 0.4, output = 2.4 }
json_schema = false   # DashScope makes a schema json_object and wants "json" in the messages: HTTP 400, 2026-10-16

[models."qwen3.8-flash"]
caps  = ["text-to-text"]
price = { input = 0.15, output = 0.47 }

[models."qwen3.7-flash"]
caps  = ["text-to-text"]
price = { input = 0.03, output = 0.13 }

[models."qwen3.6-flash"]
caps  = ["text-to-text"]
price = { input = 0.25, output = 1.5 }
json_schema = false   # DashScope makes a schema json_object and wants "json" in the messages: HTTP 400, 2026-10-16

[models."qwen-flash"]
caps  = ["text-to-text"]
price = { input = 0.05, output = 0.4 }

[models."qwen-max"]
caps  = ["text-to-text"]
price = { input = 1.6, output = 6.4 }
json_schema = false   # DashScope makes a schema json_object and wants "json" in the messages: HTTP 400, 2026-10-16

[models."qwen-plus"]
caps  = ["text-to-text"]
price = { input = 0.4, output = 1.2 }

[models."qwen-turbo"]
unlisted = "not in /v1/models; answers (2026-10-13)"
caps  = ["text-to-text"]
price = { input = 0.05, output = 0.2 }

[models."qwen3-vl-plus"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 1.6 }

[models."qwen-vl-max"]
unlisted = "on the international list; this project's workspace answers model_not_found (2026-10-13)"
caps  = ["image-to-text"]
price = { input = 0.8, output = 3.2 }

[models."qwen-vl-plus"]
unlisted = "on the international list; this project's workspace answers model_not_found (2026-10-13)"
caps  = ["image-to-text"]
price = { input = 0.21, output = 0.63 }

# Text-to-image (wan series). DashScope serves these only through its native
# async task API (submit → poll → download), handled by QwenClient.
[models."wan2.2-t2i-flash"]
unlisted = "on the international list; this project's workspace answers model_not_found (2026-10-13)"
caps  = ["text-to-image"]
price = { per_image = 0.025 }

[models."wan2.2-t2i-plus"]
unlisted = "on the international list; this project's workspace answers model_not_found (2026-10-13)"
caps  = ["text-to-image"]
price = { per_image = 0.05 }

# Image editing (qwen-image-edit series). Synchronous multimodal-generation
# endpoint: input image as a base64 data-URI (or URL) + an edit instruction.
[models."qwen-image-edit"]
unlisted = "on the international list; this project's workspace answers model_not_found (2026-10-13)"
caps  = ["image-to-image"]
price = { per_image = 0.045 }

[models."qwen-image-edit-plus"]
unlisted = "on the international list; this project's workspace answers model_not_found (2026-10-13)"
caps  = ["image-to-image"]
price = { per_image = 0.03 }

[models."qwen-image-edit-max"]
unlisted = "not in /v1/models; not probed, the edit endpoint bills per image"
caps  = ["image-to-image"]
price = { per_image = 0.075 }

# Video — Wan, through video(): an asynchronous task (X-DashScope-Async), polled
# at /api/v1/tasks/{id}, output.video_url downloaded (it lasts 24 hours). Wan
# 2.7 reads resolution and ratio; Wan 2.2 reads a pixel size, "W*H", and ignores
# a resolution — measured live 2026-10-17: 480P asked, 1920*1080 delivered and
# billed. Each model says which it reads. Wan generates its own audio. Prices
# per second, Singapore, from the Model Studio price list.
[models."wan2.7-t2v"]
caps           = ["text-to-video"]
duration_range = [2, 15]
resolutions    = ["720p", "1080p"]
aspect_ratios  = ["16:9", "9:16", "1:1", "4:3", "3:4"]
shape          = "ratio"
audio          = "always"
seed           = true
negative_prompt = true
price          = { per_second = { "720p" = 0.10, "1080p" = 0.15 } }

[models."wan2.7-i2v"]
caps           = ["image-to-video"]
frame          = "media"
duration_range = [2, 15]
resolutions    = ["720p", "1080p"]
aspect_ratios  = ["16:9", "9:16", "1:1", "4:3", "3:4"]
shape          = "ratio"
audio          = "always"
seed           = true
negative_prompt = true
price          = { per_second = { "720p" = 0.10, "1080p" = 0.15 } }

[models."wan2.2-t2v-plus"]
caps          = ["text-to-video"]
durations     = [5]
resolutions   = ["480p", "1080p"]
aspect_ratios = ["16:9", "9:16", "1:1"]
shape         = "size"
sizes         = { "480p" = { "16:9" = "832*480", "9:16" = "480*832", "1:1" = "624*624" }, "1080p" = { "16:9" = "1920*1080", "9:16" = "1080*1920", "1:1" = "1440*1440" } }
seed          = true
negative_prompt = true
price         = { per_second = { "480p" = 0.02, "1080p" = 0.10 } }
