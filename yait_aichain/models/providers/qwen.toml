# qwen — provider settings + its models (data tier)

[provider]
key      = "qwen"
client   = "qwen"
env_key  = "DASHSCOPE_API_KEY"
label    = "Qwen (DashScope)"
keys_url = "https://dashscope.aliyuncs.com"
auth     = "bearer"
max_tokens_field = "max_completion_tokens"
models_path      = "/compatible-mode/v1/models"

chat_path        = "/compatible-mode/v1/chat/completions"
images_path      = "/compatible-mode/v1/images/generations"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# Reasoning is declared because the provider maps it, though the chat models here ignore it.
# Pixel size only, written with '*' instead of 'x'; an aspect ratio has no
# field and is converted to a size at a 1024 short edge. No seed: the same
# value twice gave two different pictures, measured 2026-09-09.
format_accepts = ["size", "aspect_ratio"]
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 0.7
max_tokens  = 8192
top_p = 0.8


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · DashScope's default for chat models"
top_p       = "vendor · DashScope's default"
max_tokens  = "ours · qwen-max's own ceiling. It was 2048 until 2026-09-09 — a quarter of what the model takes and the smallest in the table, so a long answer was cut off by us rather than by the provider"
[provider.reasoning_map]
low = true
medium = true
high = true

[models."qwen3-max"]
caps  = ["text-to-text"]
price = { input = 1.2, output = 6.0 }

[models."qwen-max"]
caps  = ["text-to-text"]
price = { input = 1.6, output = 6.4 }

[models."qwen-plus"]
caps  = ["text-to-text"]
price = { input = 0.4, output = 1.2 }

[models."qwen-turbo"]
caps  = ["text-to-text"]
price = { input = 0.05, output = 0.2 }

[models."qwen3-235b-a22b"]
caps  = ["text-to-text"]
price = { input = 0.7, output = 2.8 }

[models."qwen3-72b"]
caps  = ["text-to-text"]

[models."qwen3-32b"]
caps  = ["text-to-text"]

[models."QwQ-32B"]
caps  = ["text-to-text"]

[models."qwen3-vl-plus"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 1.6 }

[models."qwen-vl-max"]
caps  = ["image-to-text"]
price = { input = 0.8, output = 3.2 }

[models."qwen-vl-plus"]
caps  = ["image-to-text"]
price = { input = 0.21, output = 0.63 }

# Text-to-image (wan series). DashScope serves these only through its native
# async task API (submit → poll → download), handled by QwenClient.
[models."wan2.2-t2i-flash"]
caps  = ["text-to-image"]

[models."wan2.2-t2i-plus"]
caps  = ["text-to-image"]

# Image editing (qwen-image-edit series). Synchronous multimodal-generation
# endpoint: input image as a base64 data-URI (or URL) + an edit instruction.
[models."qwen-image-edit"]
caps  = ["image-to-image"]

[models."qwen-image-edit-plus"]
caps  = ["image-to-image"]

[models."qwen-image-edit-max"]
caps  = ["image-to-image"]
