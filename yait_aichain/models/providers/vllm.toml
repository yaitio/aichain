# vllm — local / self-hosted OpenAI-compatible endpoint (data tier)
#
# vLLM is the reference server, but nothing here is vLLM-specific: Ollama,
# LM Studio, TGI, SGLang and llama.cpp all serve the same /v1, so this one
# provider covers every local server. Talking to it needs no dependency
# beyond the urllib3 the library already carries — the heavy packages
# (vllm, torch, CUDA) belong to *running* the server, which is the user's
# side of the line and stays out of this library.
#
# Model names are Hugging Face ids passed through verbatim; there is no
# registry to keep because the server decides what it serves:
#
#     Model("vllm/meta-llama/Llama-3.3-70B-Instruct")
#
# The prefix picks this provider; everything after the first slash — slashes
# included — is the wire name.
#
# No [models] section, deliberately. Local models have no price per token:
# their economics are GPU-hours divided by throughput, which depends on the
# card, not the model. estimate_cost() returns None for them, and that None
# is honest — a number here would be invented.

[provider]
key      = "vllm"
client   = "openai"
base_url = "http://localhost:8000"
env_key  = "VLLM_API_KEY"
# The server usually runs without auth; started with --api-key it expects a
# Bearer token. auth = "none" makes the key optional instead of required:
# no key sends no Authorization header, a provided key is sent normally.
auth     = "none"
# Point at a remote box without touching code: VLLM_BASE_URL=http://gpu:8000
# An explicit client_options={"url": ...} still wins over the env var.
base_url_env     = "VLLM_BASE_URL"
max_tokens_field = "max_tokens"
models_path      = "/v1/models"

chat_path        = "/v1/chat/completions"

[provider.defaults]
temperature = 1.0
max_tokens  = 4096
