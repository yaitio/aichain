# private — a model server you control (data tier)
#
# One provider for every OpenAI-compatible server: vLLM, Ollama, LM Studio,
# TGI, SGLang and llama.cpp all expose the same /v1, so the client neither
# knows nor cares which one answers. Talking to it needs nothing beyond the
# urllib3 the library already carries; the heavy packages (vllm, torch, CUDA)
# belong to *running* the server, which is the user's side of the line and
# stays out of this library.
#
# On the name. An earlier draft called this "vllm" and immediately read as
# "the library embeds vLLM" — exactly the dependency it was built not to
# have. The second draft, "local", was accurate but undersold the point and
# was itself imprecise, since a private server is often a remote GPU box.
# "private" names the reason the feature exists: the weights and the prompts
# stay inside a perimeter you own.
#
# What "private" does NOT mean: the library cannot verify it. Point this
# provider at a hosted aggregator (Together, Fireworks, OpenRouter, Groq) and
# it will work — the request simply leaves your perimeter, and the word on
# the prefix does not make it otherwise. The prefix describes the intent of
# your configuration, not a checked property. The docs say so out loud in a
# section of their own, because a name that quietly overpromises is worse
# than one that undersells.
#
# Model names are passed through verbatim; there is no registry to keep
# because the server decides what it serves:
#
#     Model("private/meta-llama/Llama-3.3-70B-Instruct")   # vLLM / TGI (HF id)
#     Model("private/llama3.3")                            # Ollama tag
#
# The prefix picks this provider; everything after the first slash — slashes
# included — is the wire name.
#
# No [models] section, deliberately. A model you host has no price per token:
# its economics are GPU-hours divided by throughput, which depends on the
# card, not the model. estimate_cost() returns None for them, and that None
# is honest — a number here would be invented.

[provider]
key      = "private"
client   = "openai"
base_url = "http://localhost:8000"
env_key  = "PRIVATE_API_KEY"
label    = "Private server"
# Your own server usually runs without auth; started with --api-key it
# expects a Bearer token, and an aggregator always needs one. auth = "none"
# makes the key optional instead of required: no key sends no Authorization
# header, a provided key is sent normally. (Needing a key at all is a useful
# tell — a server of your own rarely asks for one.)
auth     = "none"
# Point at another machine without touching code:
# PRIVATE_BASE_URL=http://gpu.internal:8000 — private is about who controls
# the box, not about localhost. An explicit client_options={"url": ...}
# still wins over the env var.
base_url_env     = "PRIVATE_BASE_URL"
max_tokens_field = "max_tokens"
models_path      = "/v1/models"

chat_path        = "/v1/chat/completions"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# The plain OpenAI-compatible case. What the server behind it takes is the
# server's business; the common three are claimed, and reasoning in the one
# spelling vLLM, Ollama and OpenRouter all take (below).
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

# Reasoning goes as `reasoning_effort`, the field of the OpenAI API, which is
# what this provider is written for:
#
#   * Ollama takes it on its /v1 for every model that thinks.
#   * vLLM takes it for gpt-oss, which has the levels, and maps it to the
#     chat template's `enable_thinking` for a model whose template reads that
#     switch — Qwen3, Gemma 4, Granite 4.2 — where low, medium and high are
#     the same "on" and none is "off". Started with `--reasoning-parser` (qwen3,
#     gemma4, granite_thinking_parser…) to keep the thinking out of the answer,
#     and `--enable-auto-tool-choice --tool-call-parser …` for tools.
#   * Another model or another server may ignore the field. Every call that
#     sends it says so in its notice; the server's own field goes through
#     `extra=`, e.g. extra={"chat_template_kwargs": {"thinking": True}} for
#     DeepSeek-V3.1 on vLLM. docs/models/private-models.md has the table.
[provider.reasoning_map]
none   = "none"
low    = "low"
medium = "medium"
high   = "high"

[provider.reasoning]
field = "reasoning_effort"
why   = """sent as reasoning_effort; whether it takes effect is the server's: vLLM needs a \
model that reads it (gpt-oss) or reads enable_thinking (Qwen3, Gemma 4), Ollama takes it for \
a model that thinks; for anything else send the server's own field through extra="""

[provider.defaults]
temperature = 1.0
max_tokens  = 4096

# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "ours · a self-hosted server's own defaults are not knowable from here"
max_tokens  = "ours · a self-hosted server's own defaults are not knowable from here"
