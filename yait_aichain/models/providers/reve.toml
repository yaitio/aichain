# reve — provider settings + its models (data tier)
#
# Image-only provider with its own (non-OpenAI) wire shape. Bearer auth; the
# operation is chosen by the input and maps to one of three synchronous endpoints:
#   generate  POST /v1/image/create   {prompt, aspect_ratio?, version}
#   edit      POST /v1/image/edit     {edit_instruction, reference_image, ...}   (1 image)
#   remix     POST /v1/image/remix    {prompt, reference_images:[...], ...}       (>=2 images)
# `version` defaults to "latest". Request shapes confirmed against the official
# console docs; the response parser is defensive pending a first live call.

[provider]
key      = "reve"
client   = "reve"
base_url = "https://api.reve.com"
env_key  = "REVE_API_KEY"
auth     = "bearer"
images_path = "/v1/image/create"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# An image provider: none of the text options apply.
# Shape only, by ratio: a pixel size is refused outright
# (width/height come back UNRECOGNIZED_PARAMETER), so `size` is reduced to a
# ratio. No seed for the same reason — the API rejects the parameter.
format_accepts = ["size", "aspect_ratio", "quality", "background"]
accepts = []

# The same intent in this provider's own scale. Render quality is a number
# from 1 to 15 here (`test_time_scaling`), and a transparent background is an
# entry in a `postprocessing` list rather than a setting of its own — so a
# caller writes quality="high" once and it becomes 12 here and "high" on
# OpenAI.
[provider.options.map.quality]
low    = 3
medium = 7
high   = 12

[provider.options.map.background]
transparent = "remove_background"

[provider.defaults]
temperature = 1.0
max_tokens  = 4096

# One image model with three operations. An input image switches generation →
# edit (single reference) or remix (multiple references); the prompt references
# images by position with <img>0</img> tokens in remix.
#
# Pricing is per-image (credits; $10 = 7,500 credits → ~$0.00133/credit), not
# per-token, so there is no `price` entry — `cost` stays None, like the other
# flat-per-image providers (grok-imagine / recraft / bfl). For reference:
#   create  18 credits  (~$0.024)
#   edit    30 credits  (~$0.040)
#   remix   30 credits  (~$0.040)
# Optional add-ons (forwarded via output.format) cost extra, variable by image size:
#   test_time_scaling      multiples of base cost (~$0.01 and up)
#   postprocessing upscale ~$0.002/MP (2x/3x/4x)
#   postprocessing remove_background ~$0.002/MP
#   postprocessing fit_image  free
# The response's `credits_used` field reports the exact amount per call.

# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "unused · this provider renders images and reads neither of these"
max_tokens  = "unused · this provider renders images and reads neither of these"
[models."reve-image"]
caps  = ["text-to-image", "image-to-image"]
