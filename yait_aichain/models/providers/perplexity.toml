# perplexity — provider settings + its models (data tier)

[provider]
key      = "perplexity"
client   = "perplexity"
base_url = "https://api.perplexity.ai"
env_key  = "PERPLEXITY_API_KEY"
label    = "Perplexity"
keys_url = "https://www.perplexity.ai/settings/api"
auth     = "bearer"
max_tokens_field = "max_completion_tokens"

chat_path        = "/chat/completions"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# No reasoning control: a level is declined and said in the notices.
accepts = ["temperature", "top_p", "max_tokens"]

[provider.defaults]
temperature = 0.2
max_tokens  = 8192
top_p = 0.9


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "ours · Perplexity advises a low temperature for search and factual work; 0.2 keeps answers focused without going fully deterministic — an opinion, not their default"
top_p       = "vendor · Perplexity's recommended value for nucleus sampling"
max_tokens  = "ours · practical across the Sonar family; sonar-deep-research returns far more"
# sonar-reasoning was removed 2026-10-10: the API answers "has been
# deprecated" to it. sonar-reasoning-pro is its replacement. Token prices
# below; Perplexity also charges per request by search context size
# ($5/$8/$12 per 1000 on sonar, $6/$10/$14 on pro and reasoning-pro). The
# estimate adds `per_request` at the low-context rate — the floor of what a
# call costs, where it added nothing and read about eight times low.
[models."sonar"]
caps  = ["text-to-text"]
price = { input = 1.0, output = 1.0, per_request = 0.005 }

[models."sonar-pro"]
unlisted = "not in /v1/models; answers (2026-10-13)"
caps  = ["text-to-text"]
price = { input = 3.0, output = 15.0, per_request = 0.006 }

[models."sonar-reasoning-pro"]
unlisted = "not in /v1/models; answers (2026-10-13)"
caps  = ["text-to-text"]
price = { input = 2.0, output = 8.0, per_request = 0.006 }

[models."sonar-deep-research"]
unlisted = "not in /v1/models; not probed, a call runs paid searches"
caps  = ["text-to-text"]
price = { input = 2.0, output = 8.0 }
