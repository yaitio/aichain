# bfl — Black Forest Labs (FLUX). Provider settings + models (data tier).
#
# Asynchronous image generation + editing. Auth is an `x-key` header; the model
# name is the endpoint path (POST /v1/{model}); a request returns {id,
# polling_url}; poll until status == "Ready", then download result.sample (a
# signed URL). FLUX Kontext models also edit (an input image switches them from
# generate to edit). Verified live against the BFL API (docs.bfl.ai).

[provider]
key      = "bfl"
client   = "bfl"
base_url = "https://api.bfl.ai"
env_key  = "BFL_API_KEY"
label    = "Black Forest Labs (FLUX)"
auth     = "x-key"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# An image provider: none of the text options apply.
# Image keys: size is split into the two edges, and aspect_ratio is what the Kontext models take instead.
format_accepts = ["size", "aspect_ratio", "output_format", "seed"]
accepts = []

[provider.defaults]
temperature = 1.0
max_tokens  = 4096

# Generation

# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "unused · this provider renders images and reads neither of these"
max_tokens  = "unused · this provider renders images and reads neither of these"
[models."flux-2-pro"]
caps  = ["text-to-image"]

[models."flux-pro-1.1"]
caps  = ["text-to-image"]

[models."flux-pro-1.1-ultra"]
caps  = ["text-to-image"]

[models."flux-dev"]
caps  = ["text-to-image"]

# FLUX Kontext — context-aware editing (also generates from a bare prompt).
[models."flux-kontext-pro"]
caps  = ["text-to-image", "image-to-image"]

[models."flux-kontext-max"]
caps  = ["text-to-image", "image-to-image"]
