# recraft — provider settings + its models (data tier)
#
# Image-only provider. Rides the OpenAI Bearer transport: text-to-image on the
# OpenAI-shaped /v1/images/generations, image-to-image on the multipart
# /v1/images/imageToImage. Verified live against the Recraft API.

[provider]
key      = "recraft"
client   = "recraft"
base_url = "https://external.api.recraft.ai"
env_key  = "RECRAFT_API_TOKEN"
auth     = "bearer"
images_path           = "/v1/images/generations"
images_edits_path     = "/v1/images/imageToImage"
images_vectorize_path = "/v1/images/vectorize"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# An image provider: none of the text options apply.
# Image keys: pixel size only.
format_accepts = ["size"]
accepts = []

[provider.defaults]
temperature = 1.0
max_tokens  = 4096

# Generation: recraftv4_1 is the API default. Editing (imageToImage) is
# available on the V3 models only, per the Recraft reference. Note:
# imageToImage is a strength-controlled whole-image *variation* (img2img),
# NOT a subject-preserving edit — for "place this product in a scene" use an
# instruction editor (gpt-image / gemini image / qwen-image-edit / flux-kontext).
[models."recraftv4_1"]
caps  = ["text-to-image"]

[models."recraftv4_1_vector"]
caps  = ["text-to-image"]

# V4.1 variants (live-verified model names, 2026-06): `utility` is the
# controlled raster model (flat light, front-facing, product/icon/e-commerce);
# `_pro` is the higher tier; `_vector` outputs SVG.
[models."recraftv4_1_utility"]
caps  = ["text-to-image"]

[models."recraftv4_1_utility_pro"]
caps  = ["text-to-image"]

[models."recraftv4_1_pro"]
caps  = ["text-to-image"]

[models."recraftv4_1_utility_vector"]
caps  = ["text-to-image"]

# Raster → vector conversion (trace), not generation. No prompt, no content
# change — the input image is converted to SVG as-is. POST /v1/images/vectorize,
# multipart {image}; response {"image": {"b64_json"|"url"}} → SVG. Lives under
# image-to-image (input image in, image out); 10 credits/op (verified live).
[models."recraft-vectorize"]
caps  = ["image-to-image"]

[models."recraftv3"]
caps  = ["text-to-image", "image-to-image"]

[models."recraftv3_vector"]
caps  = ["text-to-image", "image-to-image"]
