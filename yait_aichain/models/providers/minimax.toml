# minimax — MiniMax: provider settings + its models (data tier)
#
# Read 2026-10-11 from platform.minimax.io's OpenAI API reference: chat
# completions at api.minimax.io/v1 (China: api.minimaxi.com/v1). Not yet
# called live. Prices: platform.minimax.io/docs/pricing/overview (pay as you
# go, standard tier), read 2026-10-11, USD per 1M tokens. M3's is the
# "permanent 50% off" price, which is the price; above 512k input tokens it
# doubles. The M2 line is listed there as legacy; highspeed is twice the price
# of the same model.
#
# From the reference: thinking is `{"type": "adaptive"}` or
# `{"type": "disabled"}`; `reasoning_split = true` puts the thinking in
# `reasoning_content` instead of `<think>` tags inside the answer, so it is sent
# on every request; `reasoning_effort` exists on M3.1-Flash-Preview only;
# penalties and logit_bias are ignored; `n` is 1.

[provider]
key      = "minimax"
client   = "openai"
base_url = "https://api.minimax.io"
env_key  = "MINIMAX_API_KEY"
label    = "MiniMax"
keys_url = "https://platform.minimax.io"
auth     = "bearer"
max_tokens_field = "max_completion_tokens"
models_path      = "/v1/models"
chat_path        = "/v1/chat/completions"

[provider.options]
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]
# Measured 2026-10-11: a json_schema response_format is accepted and not
# followed — M3, M2.7 and M2.5 answered with fields the closed schema did not
# declare, and M3 and M2.7 fenced the JSON in ```json. So the schema goes in
# the prompt, and the answer is checked against it here.
json_schema = false

[provider.options.values]
temperature = [0.0, 2.0]
top_p       = [0.0, 1.0]

[provider.defaults]
temperature = 1.0
max_tokens  = 16384
top_p       = 0.95

[provider.default_notes]
temperature = "vendor · MiniMax's default, and the value it recommends"
top_p       = "vendor · MiniMax's default for M3"
max_tokens  = "ours · thinking counts toward it, and a small value ends in finish_reason length with nothing said"

[provider.request]
always = { reasoning_split = true }

# A level keeps adaptive thinking on — M3 takes no depth; `none` turns it off.
[provider.reasoning_map]
low    = "adaptive"
medium = "adaptive"
high   = "adaptive"

[provider.reasoning]
field = ""
on    = { thinking = { type = "adaptive" } }
off   = { thinking = { type = "disabled" } }
why   = "M3 thinks adaptively and takes no level; any level keeps thinking on"

[models."MiniMax-M3"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.30, output = 1.20, cache_read = 0.06, long_context = { above = 512000, input = 0.60, output = 2.40 } }

[models."MiniMax-M2.7"]
caps  = ["text-to-text"]
price = { input = 0.3, output = 1.2, cache_read = 0.06 }

[models."MiniMax-M2.7-highspeed"]
caps  = ["text-to-text"]
price = { input = 0.6, output = 2.4, cache_read = 0.06 }

[models."MiniMax-M2.5"]
caps  = ["text-to-text"]
price = { input = 0.3, output = 1.2, cache_read = 0.03 }

[models."MiniMax-M2.5-highspeed"]
caps  = ["text-to-text"]
price = { input = 0.6, output = 2.4, cache_read = 0.03 }

[models."MiniMax-M2.1"]
caps  = ["text-to-text"]
price = { input = 0.3, output = 1.2, cache_read = 0.03 }

[models."MiniMax-M2.1-highspeed"]
caps  = ["text-to-text"]
price = { input = 0.6, output = 2.4, cache_read = 0.03 }

[models."MiniMax-M2"]
caps  = ["text-to-text"]
price = { input = 0.3, output = 1.2, cache_read = 0.03 }

# Video — MiniMax H3, through video(): POST /v2/video_generation with a content
# list (the prompt, and an image as the first frame), poll /v2/query/
# video_generation/{id}, download task.content.url. A text-to-video request
# needs a ratio; with a first frame the shape follows the image. 2K is
# 2560×1440. Prices per second of output, from the MiniMax price list,
# 2026-10-17; the Hailuo models of the v1 API are not here.
[models."MiniMax-H3"]
caps           = ["text-to-video", "image-to-video"]
duration_range = [4, 15]
resolutions    = ["768p", "2k"]
aspect_ratios  = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
price          = { per_second = { "768p" = 0.08, "2k" = 0.13 } }

[models."MiniMax-H3-Max"]
caps           = ["text-to-video", "image-to-video"]
duration_range = [5, 15]
resolutions    = ["480p", "768p"]
aspect_ratios  = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
price          = { per_second = { "480p" = 0.05, "768p" = 0.08 } }
