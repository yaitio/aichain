# openai — provider settings + its models (data tier)

[provider]
key      = "openai"
client   = "openai"
base_url = "https://api.openai.com"
env_key  = "OPENAI_API_KEY"
auth     = "bearer"
max_tokens_field = "max_completion_tokens"
models_path      = "/v1/models"

chat_path        = "/v1/chat/completions"
images_path      = "/v1/images/generations"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# No top_k on this wire at all, and no cache control — caching is implicit and appears in usage.
# Image keys too: no seed. `reference_fidelity` (this API's own
# `input_fidelity`) is refused by several of the models — see `rejects` on
# each. An aspect ratio is converted to pixels, which is what this API takes.
format_accepts = ["size", "quality", "background", "output_format", "compression", "reference_fidelity"]
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

# What a value may be, where the API constrains it. A two-number entry is a
# range and is clamped; anything else is a set and is refused, with the list
# named — better than paying for a round trip to be told
# "Invalid value: 'ultra-max-supreme'".
[provider.options.values]
quality            = ["low", "medium", "high", "auto"]
background         = ["transparent", "opaque", "auto"]
output_format      = ["png", "jpeg", "webp"]
compression        = [0, 100]
reference_fidelity = ["low", "high"]
reasoning          = ["none", "low", "medium", "high"]

[provider.defaults]
temperature = 1.0
max_tokens  = 16384
top_p = 1.0

[provider.reasoning_map]
# "none" switches deliberation off entirely on the Responses API (gpt-5.x).
# Without it the server default is "medium" — an agent that reasons on every
# turn while a chat-completions twin runs with reasoning_effort="none" is NOT
# a leveled comparison, and a deliberating model is measurably more
# policy-cautious in dialogue.
none = "none"
low = "low"
medium = "medium"
high = "high"

# GPT-5.6 — three tiers of one family rather than a size ladder; all three
# carry the same 1.05M context and 128K output, and differ only in price and
# depth. Terra and Luna were cut on 2026-07-30; these are the rates after.
[models."gpt-5.6-sol"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 5.0, output = 30.0 }

[models."gpt-5.6-terra"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 2.0, output = 12.0 }

[models."gpt-5.6-luna"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 1.2 }

[models."gpt-5.5"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 5.0, output = 30.0 }

[models."gpt-5.5-pro"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 30.0, output = 180.0 }

[models."gpt-5.4"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 2.5, output = 15.0 }

[models."gpt-5.4-mini"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.75, output = 4.5 }

[models."gpt-5.4-nano"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 1.25 }

[models."gpt-5.4-pro"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 30.0, output = 180.0 }

[models."gpt-4o"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 2.5, output = 10.0 }

[models."gpt-4o-mini"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.15, output = 0.6 }

# Image-generation models. Token-priced: input = text prompt tokens,
# output = generated image tokens (USD per 1M tokens).
#
# `input` is the TEXT input rate; `image_input` is what an image sent *in*
# costs, which is dearer — $8/M against $5/M on the 2.5 family. The provider
# reports the split in `usage.input_tokens_details`, and a model without the
# field is billed at the text rate.
#
# Within the 2.5 family the rates are identical by design. OpenAI states it
# outright: "Equal token rates don't mean equal cost per image: token
# consumption can differ by model and quality setting." A cheaper model is
# cheaper per picture at the same price per token.
# Flare is the one to reach for by default: OpenAI's own announcement calls it
# "the default choice for most applications", higher quality than gpt-image-2
# at half the latency. Sunburst is the premium end — it earns its place where
# edits need tight control, not where a picture is merely wanted.
[models."gpt-image-2.5-flare"]
# xhigh and max are this generation's alone: gpt-image-1.5 refuses them.
values = { quality = ["low", "medium", "high", "xhigh", "max", "auto"] }
caps  = ["text-to-image", "image-to-image"]
price = { input = 5.0, output = 30.0, image_input = 8.0 }
rejects = ["reference_fidelity"]

[models."gpt-image-2.5-sunburst"]
# xhigh and max are this generation's alone: gpt-image-1.5 refuses them.
values = { quality = ["low", "medium", "high", "xhigh", "max", "auto"] }
caps  = ["text-to-image", "image-to-image"]
price = { input = 5.0, output = 30.0, image_input = 8.0 }
rejects = ["reference_fidelity"]

# `rejects` lists parameters the API refuses for this model, measured against
# it rather than read off the guide — which names only gpt-image-2, while both
# 2.5 models and gpt-image-1-mini refuse it too. gpt-image-2 processes every
# image input at high fidelity by itself, so dropping the parameter asks for
# what it would have done anyway.
[models."gpt-image-2"]
caps  = ["text-to-image", "image-to-image"]
price = { input = 5.0, output = 30.0 }
rejects = ["reference_fidelity"]

# Always-current image model used by ChatGPT (alias to the latest snapshot).
[models."chatgpt-image-latest"]
caps  = ["text-to-image", "image-to-image"]
price = { input = 5.0, output = 30.0 }

[models."gpt-image-1.5"]
caps  = ["text-to-image", "image-to-image"]
price = { input = 5.0, output = 32.0 }

[models."gpt-image-1-mini"]
caps  = ["text-to-image", "image-to-image"]
price = { input = 2.0, output = 8.0 }
rejects = ["reference_fidelity"]

[models."gpt-image-1"]
caps  = ["text-to-image", "image-to-image"]
