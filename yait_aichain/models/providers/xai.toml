# xai — provider settings + its models (data tier)

[provider]
key      = "xai"
client   = "openai"
base_url = "https://api.x.ai"
env_key  = "XAI_API_KEY"
auth     = "bearer"
max_tokens_field = "max_completion_tokens"
models_path      = "/v1/models"

chat_path        = "/v1/chat/completions"
images_path      = "/v1/images/generations"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# Reasoning only on grok-3-mini; other grok models think natively and take no setting.
# Shape only. `size` is refused by the API outright and becomes a ratio;
# `seed` is accepted and does nothing — the same seed twice produced two
# different pictures, measured 2026-09-09 — so it is not claimed. The API
# silently swallows unknown keys, which is why an HTTP 200 was not taken as
# evidence of support here.
format_accepts = ["size", "aspect_ratio"]
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 1.0
max_tokens  = 16384
top_p = 1.0


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · the OpenAI-compatible default"
top_p       = "vendor · the OpenAI-compatible default"
max_tokens  = "ours · practical; grok-3 carries 131072 of context and grok-4 256000"
[provider.reasoning_map]
low = "low"
medium = "high"
high = "high"

[models."grok-4-0709"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 3.0, output = 15.0 }

[models."grok-4-fast-reasoning"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 0.5 }

[models."grok-4-fast-non-reasoning"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 0.5 }

[models."grok-4-1-fast-reasoning"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.2, output = 0.5 }

[models."grok-3"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 3.0, output = 15.0 }

[models."grok-3-fast"]
caps  = ["image-to-text", "text-to-text"]

[models."grok-3-mini"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.3, output = 0.5 }

[models."grok-imagine-image"]
caps  = ["text-to-image", "image-to-image"]
