# google — provider settings + its models (data tier)

[provider]
key      = "google"
client   = "google"
base_url = "https://generativelanguage.googleapis.com/v1beta"
env_key  = "GOOGLE_AI_API_KEY"
label    = "Google AI"
keys_url = "https://aistudio.google.com/app/apikey"
auth     = "x-goog-api-key"
max_tokens_field = "maxOutputTokens"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# No explicit caching: this provider caches on its own and reports the saving in usage.
# Shape only: this provider takes a ratio and picks the pixel count itself.
# No seed — accepted in generationConfig and returns 200, and the same value
# twice gave two different pictures (measured 2026-09-09). No output_format:
# it returns PNG and reads no such field.
# so `size` is kept as a shape and the pixels are left to it. Wired 2026-09-09
# after the matrix measured "reads nothing" and the API turned out to accept
# imageConfig.aspectRatio perfectly well — a gap, not a limitation.
format_accepts = ["size", "aspect_ratio"]
accepts = ["temperature", "top_p", "top_k", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 1.0
max_tokens  = 8192
top_p = 0.95
top_k = 40


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · the Gemini 2.x default (1.5 used 0.9)"
top_p       = "vendor · Google's recommended default for controlled generation"
top_k       = "vendor · Google's default for Gemini 2.x Flash; 1.5 Pro used 64"
max_tokens  = "ours · applies to every current Gemini; 2.5-pro takes up to 65536 with thinking off"
[provider.reasoning_map]
low = 2048
medium = 8192
high = 24576

[models."gemini-3.1-pro-preview"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 2.0, output = 12.0 }

[models."gemini-3.1-flash-lite-preview"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.25, output = 1.5 }

[models."gemini-3-flash-preview"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.5, output = 3.0 }

[models."gemini-3-pro-image"]
caps  = ["text-to-image", "image-to-image"]

[models."gemini-3.1-flash-image"]
caps  = ["text-to-image", "image-to-image"]

[models."gemini-2.5-flash-image"]
caps  = ["text-to-image", "image-to-image"]

[models."gemini-2.5-pro"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 1.25, output = 10.0 }

[models."gemini-2.5-flash"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.3, output = 2.5 }

[models."gemini-2.5-flash-lite"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.1, output = 0.4 }
