# stepfun — StepFun: provider settings + its models (data tier)
#
# Read 2026-10-11. The API itself is from third-party guides — StepFun's
# reference answered 404 to the paths tried: OpenAI-compatible at
# api.stepfun.ai/v1 (China: api.stepfun.com/v1), `step-5-preview` with
# low/medium/high reasoning effort, JSON Schema output and tool calling. The
# model ids are the key's model list; the prices are StepFun's own,
# platform.stepfun.ai/docs/en/pricing/details, USD per 1M tokens — where
# step-5-preview's cache read is $0.10, not the $0.05 the guides quoted, and
# step-5-preview and step-3.7-flash are listed as multimodal.

[provider]
key      = "stepfun"
client   = "openai"
base_url = "https://api.stepfun.ai"
env_key  = "STEPFUN_API_KEY"
label    = "StepFun"
keys_url = "https://platform.stepfun.ai"
auth     = "bearer"
max_tokens_field = "max_tokens"
models_path      = "/v1/models"
chat_path        = "/v1/chat/completions"

[provider.options]
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 1.0
max_tokens  = 16384
top_p       = 1.0

[provider.default_notes]
temperature = "ours · the OpenAI-compatible default; StepFun's own is not confirmed"
top_p       = "ours · the OpenAI-compatible default; StepFun's own is not confirmed"
max_tokens  = "ours · the model takes up to 64K out by third-party report; a ceiling is ours to pick"

[provider.reasoning_map]
low    = "low"
medium = "medium"
high   = "high"

[provider.reasoning]
field = "reasoning_effort"

[models."step-5-preview"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 1.00, output = 2.70, cache_read = 0.10 }

[models."step-3.7-flash"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.20, output = 1.15, cache_read = 0.04 }

[models."step-3.5-flash"]
caps  = ["text-to-text"]
price = { input = 0.10, output = 0.30, cache_read = 0.02 }

[models."step-3.5-flash-2603"]
caps  = ["text-to-text"]
price = { input = 0.10, output = 0.30, cache_read = 0.02 }
