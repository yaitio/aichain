# kimi — provider settings + its models (data tier)

[provider]
key      = "kimi"
client   = "openai"
base_url = "https://api.moonshot.ai"
env_key  = "MOONSHOT_API_KEY"
label    = "Kimi (Moonshot AI)"
keys_url = "https://platform.kimi.ai/"
auth     = "bearer"
max_tokens_field = "max_tokens"
models_path      = "/v1/models"

chat_path        = "/v1/chat/completions"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# No top_k.
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 1.0
max_tokens  = 32768
top_p = 0.95


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · Kimi's default, and the API *enforces* 1.0 while thinking is on. The non-thinking recommendation of 0.6 has to be asked for explicitly"
top_p       = "vendor · Kimi's default"
max_tokens  = "vendor · Kimi's own default, which is why this one is the largest in the table"
[provider.reasoning_map]
low = "enabled"
medium = "enabled"
high = "enabled"

# Flagship: 1M context, and the first Kimi priced like a frontier model —
# output at 15.0 is nearly four times k2.6, and every reply carries a
# reasoning trace billed at that same output rate, so a short answer is not a
# cheap one here.
[models."kimi-k3"]
caps  = ["text-to-text"]
price = { input = 3.0, output = 15.0 }

# Coding-focused; runs with Thinking enabled by default on the Kimi API (the
# client never disables it, so it works out of the box). For non-coding tasks
# Moonshot recommends kimi-k2.6.
[models."kimi-k2.7-code"]
caps  = ["text-to-text"]
price = { input = 0.95, output = 4.0 }

[models."kimi-k2-0905-preview"]
caps  = ["text-to-text"]
price = { input = 0.6, output = 2.5 }

[models."kimi-k2-turbo-preview"]
caps  = ["text-to-text"]

[models."kimi-k2-thinking"]
caps  = ["text-to-text"]

[models."kimi-k2-thinking-turbo"]
caps  = ["text-to-text"]

[models."kimi-k2.5"]
caps  = ["image-to-text", "text-to-text"]

[models."kimi-k2.6"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 0.95, output = 4.0 }
