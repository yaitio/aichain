# deepseek — provider settings + its models (data tier)

[provider]
key      = "deepseek"
client   = "openai"
base_url = "https://api.deepseek.com"
env_key  = "DEEPSEEK_API_KEY"
auth     = "bearer"
max_tokens_field = "max_tokens"
models_path      = "/models"

chat_path        = "/v1/chat/completions"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# No top_k. Reasoning is a separate model here, so asking for it swaps the model.
accepts = ["temperature", "top_p", "max_tokens", "reasoning"]

[provider.defaults]
temperature = 1.0
max_tokens  = 4096
top_p = 1.0


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · DeepSeek's API default. It was 0.0 here until 2026-09-09 — their advice for code and maths, adopted as a house choice, which left one provider deterministic while every other one was not. Their advice is still good; it is the caller's to take"
top_p       = "vendor · DeepSeek's default"
max_tokens  = "ours · practical for deepseek-chat; deepseek-reasoner needs 32768 for its CoT"
[provider.reasoning_map]
low = "deepseek-chat"
medium = "deepseek-chat"
high = "deepseek-reasoner"

[models."deepseek-chat"]
caps  = ["text-to-text"]
price = { input = 0.27, output = 1.1 }

[models."deepseek-reasoner"]
caps  = ["text-to-text"]
price = { input = 0.55, output = 2.19 }
