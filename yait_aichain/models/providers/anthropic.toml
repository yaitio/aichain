# anthropic — provider settings + its models (data tier)

[provider]
key      = "anthropic"
client   = "anthropic"
base_url = "https://api.anthropic.com"
env_key  = "ANTHROPIC_API_KEY"
label    = "Anthropic"
keys_url = "https://console.anthropic.com/settings/keys"
auth     = "x-api-key"
max_tokens_field = "max_tokens"
models_path      = "/v1/models"

[provider.options]
# Which universal options this provider has a control for at
# all — not which a given model takes on a given call, which is
# a runtime adaptation and is reported when it happens.
# Everything, including an explicit cache breakpoint — the one provider that asks to be told where the stable prefix ends.
accepts = ["temperature", "top_p", "top_k", "max_tokens", "reasoning", "cache_control", "cache_ttl"]

[provider.defaults]
temperature = 1.0
max_tokens  = 8192


# Where these numbers come from, and who chose them. Recovered 2026-09-09
# from the per-provider modules that the 1.2.3 migration dissolved: that
# commit said "behaviour is byte-for-byte unchanged", which was true of the
# values and false of the reasons — the docstrings carrying them were deleted
# and the numbers arrived here naked. "vendor" marks this provider's own
# documented default; "ours" marks a choice the library made, which is a
# thing a caller is entitled to disagree with.
[provider.default_notes]
temperature = "vendor · Anthropic's API default. The range here is 0.0-1.0, not 0-2"
max_tokens  = "ours · the API *requires* the field, so a number had to be picked; 8192 is safe across the family and Claude 4 takes up to 64000"
top_p       = "ours · left unset on purpose: Anthropic asks for temperature or top_p, not both"
[provider.reasoning_map]
low = 4000
medium = 10000
high = 20000

[models."claude-fable-5"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 10.0, output = 50.0 }

[models."claude-opus-5"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 5.0, output = 25.0 }

[models."claude-opus-4-8"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 5.0, output = 25.0 }

[models."claude-opus-4-7"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 5.0, output = 25.0 }

[models."claude-opus-4-6"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 5.0, output = 25.0 }

# Standard rate. An introductory 2.0/10.0 runs through 2026-08-31, so cost
# estimates read high until then — deliberately, since the discount expires
# and a price that has to be edited back up is worse than one that is right
# a month from now.
[models."claude-sonnet-5"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 3.0, output = 15.0 }

[models."claude-sonnet-4-6"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 3.0, output = 15.0 }

[models."claude-haiku-4-5-20251001"]
caps  = ["image-to-text", "text-to-text"]
price = { input = 1.0, output = 5.0 }
