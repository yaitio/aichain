[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yait-aichain"
dynamic = ["version"]            # single source of truth: yait_aichain.__version__
description = "The provider-agnostic AI toolkit for Python: pipelines and agents your coding agent can write, that run unchanged from a laptop to production, on any model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YAIT" }]
requires-python = ">=3.10"

dependencies = [
    "urllib3>=2.0",
    # Provider data is TOML; tomllib is in the standard library from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
yaml    = ["pyyaml>=5.1"]
# Bounded above: 5 is a major version nobody has run this against, and the
# client API this package calls has changed between majors before.
mcp     = ["fastmcp>=2.10,<5"]
# fetchLocal reads pages through a requests session of its own.
fetch   = ["markitdown", "requests"]
# Google's speech tools call its SDKs.
google  = ["google-cloud-texttospeech", "google-cloud-speech"]
# Splitting a long recording. pydub needs audioop, which left the standard
# library in 3.13.
audio   = ["pydub", "audioop-lts; python_version >= '3.13'"]
all     = ["yait-aichain[yaml,mcp,fetch,google,audio]"]

[project.urls]
Homepage   = "https://github.com/yaitio/aichain"
Repository = "https://github.com/yaitio/aichain"

[tool.setuptools.packages.find]
where = ["."]
include = ["yait_aichain*"]

[tool.setuptools.package-data]
"yait_aichain" = ["py.typed"]
"yait_aichain.models" = ["providers/*.toml"]

# Version is read from yait_aichain/__init__.py (__version__) — one place to bump.
[tool.setuptools.dynamic]
version = { attr = "yait_aichain.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real provider API or server; needs keys and network (tests/conftest.py)",
]

[tool.coverage.run]
source = ["yait_aichain"]

[tool.coverage.report]
# The floor. Measured 2026-09-13 at 77.07%, raised to 77.9 the same day when
# the Pool and Chain contract tests brought it to 77.93% on 3.10 and 3.14
# alike. It only rises. What is under it, and why, is the register below.
fail_under = 78.0

[tool.coverage.register]
# Every module under 60% coverage, with a kind and a reason. The number is what
# is left after these decisions; .github/scripts/coverage_register.py checks
# the list both ways in CI — a gap with no entry fails, and so does an entry
# whose module has climbed past the line. Kinds: external (the uncovered lines
# are a vendor's request path), optional-dependency, legacy, debt (testable
# offline and not yet tested — the list to shrink).
"yait_aichain/tools/transcribe/_stt.py" = { kind = "external", reason = "transcription paths call four vendors' speech APIs" }
"yait_aichain/tools/embed/_cohere.py" = { kind = "external", reason = "request shaping for the Cohere embeddings API" }
"yait_aichain/tools/rerank/_voyage.py" = { kind = "external", reason = "request shaping for the Voyage rerank API" }
"yait_aichain/utilities/vectors/providers/_pinecone.py" = { kind = "external", reason = "every operation needs a Pinecone index" }
"yait_aichain/utilities/vectors/__init__.py" = { kind = "external", reason = "`VectorDB` connects to a provider on construction" }
"yait_aichain/utilities/shell/_browse.py" = { kind = "debt", reason = "sandboxed and filesystem-only; a temporary directory is all a test needs" }
"yait_aichain/utilities/shell/_write.py" = { kind = "debt", reason = "sandboxed and filesystem-only" }

[tool.mutmut]
# Which tests actually catch a broken line. A mutant is a one-token change to
# the library; a mutant no test kills is a line the suite does not guard.
paths_to_mutate = ["yait_aichain/pool/_pool.py", "yait_aichain/chain/_chain.py"]
tests_dir = ["tests/"]
# The sandbox is a copy, not a git checkout, so the one test that asks git is
# out of place there; everything else runs as in CI.
pytest_add_cli_args = ["-m", "not live", "-p", "no:warnings",
                       "--deselect", "tests/test_changelog.py::TestTheChangelogCoversWhatShipped::test_it_is_tracked_by_git"]
# The whole package, so the files not being mutated still import.
also_copy = ["yait_aichain", "examples", "docs", "evals", "README.md", "CHANGELOG.md",
             "llms.txt", "SKILL.md", ".github"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Checked in CI on the package. Pyflakes for names that do not exist or are
# never used; UP037/UP035 because every module has `from __future__ import
# annotations`, so a quoted annotation or a `typing.List` is noise an agent
# reading the code pays for.
select = ["F", "UP035", "UP037", "RUF100"]