[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yait-aichain"
dynamic = ["version"]            # single source of truth: yait_aichain.__version__
description = "One interface. 11 providers. 82 models. Text, image generation & editing, vision, RAG, agents, parallel pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "YAIT" }]
requires-python = ">=3.10"

dependencies = [
    "urllib3>=2.0",
]

[project.optional-dependencies]
convert = ["markitdown"]
yaml    = ["pyyaml"]
mcp     = ["fastmcp"]
all     = ["markitdown", "pyyaml", "fastmcp"]

[project.urls]
Homepage   = "https://github.com/yaitio/aichain"
Repository = "https://github.com/yaitio/aichain"

[tool.setuptools.packages.find]
where = ["."]
include = ["yait_aichain*"]

[tool.setuptools.package-data]
"yait_aichain.models" = ["providers/*.toml"]

# Version is read from yait_aichain/__init__.py (__version__) — one place to bump.
[tool.setuptools.dynamic]
version = { attr = "yait_aichain.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: calls a real provider API or server; needs keys and network (tests/conftest.py)",
]

[tool.coverage.run]
source = ["yait_aichain"]

[tool.coverage.report]
# The floor. Measured 2026-09-13 at 77.07%, raised to 77.9 the same day when
# the Pool and Chain contract tests brought it to 77.93% on 3.10 and 3.14
# alike. It only rises. What is under it, and why, is in COVERAGE.md.
fail_under = 77.9

[tool.ruff]
line-length = 100
target-version = "py310"