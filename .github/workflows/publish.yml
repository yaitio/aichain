name: Publish to PyPI

# Push a version tag (e.g. `git push origin v1.3.1`) and this builds the
# package and publishes it to PyPI via Trusted Publishing (OIDC — no API
# token or secret is stored). One-time setup: add a Trusted Publisher on
# https://pypi.org/manage/project/yait-aichain/settings/publishing/
# (owner: yaitio, repo: aichain, workflow: publish.yml).

on:
  push:
    tags:
      - "v*"

jobs:
  # The gate. It existed before 2.17.1 and ran on 3.12 only — the one version
  # where the PEP 701 f-string that broke 3.10/3.11 is legal — so eleven
  # unimportable releases passed through a gate that was standing. Every
  # version `requires-python` covers now has to pass before anything is built.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all]" pytest pytest-asyncio
      - run: pytest -m "not live"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refuse to publish if the tag does not match the packaged version.
      # Version is the single source of truth in yait_aichain/__init__.py
      # (__version__); pyproject reads it dynamically, so we check that file.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\x27\x22]([^\x27\x22]+)', pathlib.Path('yait_aichain/__init__.py').read_text()).group(1))")
          echo "tag=$TAG  __version__=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match yait_aichain.__version__ $PKG"; exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
