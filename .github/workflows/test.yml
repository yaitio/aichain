name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `requires-python` promises; the ceiling is what the
        # library is developed on. 2.7.0–2.17.0 were unimportable on 3.10/3.11
        # while development ran on 3.14 — both ends have to be here.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all]" pytest
      # *Live* tests hit real provider APIs (keys + network) — skipped in CI.
      - run: pip install pytest-cov
      - run: pytest -m "not live" --cov=yait_aichain --cov-report=term --cov-report=json:coverage.json
      # The floor lives in pyproject.toml; the register of what is under it and
      # why is [tool.coverage.register] beside it. Both are held here.
      - run: python .github/scripts/coverage_register.py coverage.json
      # Generated pages: the tests hold them too, but a named step says which
      # page went stale and how to regenerate it, instead of a diff in a log.
      # Names that do not exist, imports nobody uses, quoted annotations — the
      # rules are in pyproject.toml, the version is pinned so a ruff release
      # cannot turn the build red on its own.
      - run: pip install ruff==0.16.0 && ruff check yait_aichain
      - run: python .github/scripts/docs.py --check
      - run: python .github/scripts/examples_index.py --check
      # The Claude Code plugin is generated from SKILL.md, llms.txt and the
      # tuning tasks' references; a stale copy fails here.
      - run: python .github/scripts/skill.py --check

  # The release build, on every push: the wheel carries the docs of its own
  # version (yait_aichain.docs_dir()), and a pattern that stops matching them
  # fails here rather than on the day of a release.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh .github/scripts/build.sh

  # One stable name for branch protection to require. The matrix names change
  # whenever a Python version is added or dropped; this one does not.
  gate:
    if: always()
    needs: [test, wheel]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success" && test "${{ needs.wheel.result }}" = "success"
